<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Playlist Criada</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light text-center">
  <div class="container py-5">
    <div class="alert alert-success shadow-sm py-4">
      <h1 class="mb-3"><i class="bi bi-check-circle-fill"></i> Playlist Criada com Sucesso!</h1>
      <p class="lead">Clique no botão abaixo para acessar sua playlist:</p>
      <a href="https://www.youtube.com/playlist?list={{ playlist_id }}" class="btn btn-success mt-3" target="_blank">
        <i class="bi bi-play-btn-fill"></i> Ver Playlist
      </a>
    </div>
    <a href="/" class="btn btn-secondary mt-3"><i class="bi bi-arrow-repeat"></i> Criar outra</a>
  </div>
</body>
</html>
