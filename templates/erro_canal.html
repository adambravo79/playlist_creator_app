<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Erro: Canal Inexistente</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light text-center">
  <div class="container py-5">
    <div class="alert alert-danger shadow-sm py-4">
      <h1 class="mb-3"><i class="bi bi-x-circle-fill"></i> Canal do YouTube não encontrado</h1>
      <p class="lead">Você precisa criar um canal no YouTube antes de poder criar playlists.</p>
      <a href="https://www.youtube.com/create_channel" class="btn btn-primary mt-3" target="_blank">
        <i class="bi bi-person-plus"></i> Criar Canal Agora
      </a>
    </div>
    <a href="/" class="btn btn-secondary mt-3"><i class="bi bi-arrow-left"></i> Voltar</a>
  </div>
</body>
</html>
